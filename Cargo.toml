# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core"
description = "Core identifiers, execution facts and shared contracts for Xmip."

[features]
# On by default so an identifier is a UUIDv7 unless someone deliberately opts
# out. Optional so xmip-core stays dependency-free for anyone who supplies
# their own IdGenerator.
default = ["serde", "std", "uuid-v7"]
uuid-v7 = ["std", "dep:uuid"]

# The system clock (clock.rs) and the timed wait (wake.rs). Off on a
# microcontroller, which supplies its own Clock as it supplies its own
# IdGenerator.
std = ["dep:windows-sys"]

# What the estate's tests measure with: the processor time a thread and the
# process have used (processor_time.rs) and the one latency spread
# (latency.rs). Never in a node.
test-support = ["std", "dep:libc"]

# Identifiers appear in every serialised structure in Xmip, so this is on by
# default. Optional so a consumer who serialises nothing pays for nothing.
serde = ["dep:serde"]

[dependencies]
# default-features = false, because serde's default pulls in std and this crate
# is no_std. "alloc" is what brings back String and Vec support, which is all
# an identifier needs to serialise. Proven against thumbv7em-none-eabihf, a
# Cortex-M7 bare-metal target — Meadow's chip family. "derive" is for a
# technology's settings declaration (settings.rs), which crosses to the
# language server and the desktop editor as JSON; derive needs no std.
serde = { version = "1", default-features = false, features = ["alloc", "derive"], optional = true }

# Stays std-only, and that is correct rather than an omission. UUIDv7 needs a
# clock and an entropy source, and a microcontroller has neither by default.
# A device supplies its own IdGenerator, which is why the trait exists and why
# this feature was optional before any of this.
uuid = { version = "1", features = ["v7"], optional = true }

# A secret's value is overwritten when it is dropped (secret.rs), never left
# for the allocator. no_std with alloc, as this crate is; the version
# xmip-core-secret already builds.
zeroize = { version = "1", default-features = false, features = ["alloc"] }

# The operating system's calls (system.rs): on Windows the timed wait's
# kernel event and high-resolution waitable timer (the owner, 2026-10-16)
# and, for tests, the cycle counts. The version the runtime, audit and
# secret already build, so nothing new is compiled.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

# For tests on Unix, the processor time a thread and the process have used:
# clock_gettime (system.rs). In the lock already.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[lib]
path = "src/lib.rs"

# deny, not forbid: src/system.rs allows unsafe code with its reason at the
# top (ADR-0050, amendment 2026-10-17), and nothing else may.
# test/Unsafe.Test.ps1 holds the list.
[lints.rust]
unsafe_code = "deny"

[dev-dependencies]
# Only to prove an identifier serialises as text rather than as a number.
serde_json = "1"

[profile.dev.package."*"]
opt-level = 3
